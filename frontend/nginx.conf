server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Route-specific cache headers must not replace these security headers.
    add_header Cache-Control $nro_cache;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = / { try_files /index.html =404; }
    location = /login { try_files /index.html =404; }
    location = /service-health { try_files /index.html =404; }
    location ~ ^/sites/[^/.]+$ { try_files /index.html =404; }
    location / { try_files $uri =404; }
}

map $uri $nro_cache {
    default "no-cache, must-revalidate";
    ~^/assets/ "public, max-age=31536000, immutable";
}
